        <div id="formulario">
                    <form action="procesar.html" method="post">
                        <h4>¿Tienes alguna pregunta? Envianosla con el siguiente formulario:</h4>
                        <div class="input-group">
                            <label for="nombreUsuario">Nombre:</label> 
                            <input type="text" id="nombreUsuario" name="nombreUsuario" placeholder="Inserte el Nombre">
                            <label for="emailUsuario">Email:</label > 
                            <input type="email" id="emailUsuario" name="EmailUsuario" placeholder="Inserte el correo">

                            <textarea name="textoFormulario" id="textoFormulario" cols="30" rows="5" placeholder="Pregunta"></textarea>
                        </div>
                        <p>Al enviar el formulario acepta los <a href="#">Terminos y condiciones</a> y la <a href="#">Policitica de Privadad</a> de esta página. </p>
                        <input type="submit" id="enviar" value="Enviar">
                        <input type="reset" id="borrar" value="Borrar formulario">
                    </form>
